# =============================================================================
# Parameter proxy Walimah — dipasang di /etc/nginx/snippets/walimah-proxy.conf
# oleh deploy/install.sh. Jangan disunting di tempat; sunting di repo.
# =============================================================================

proxy_http_version 1.1;

# Kosongkan Connection agar koneksi ke upstream bisa dipakai ulang (keepalive).
# Aplikasi ini tidak memakai WebSocket, jadi tidak ada Upgrade yang perlu
# diteruskan; menyetel "upgrade" tanpa syarat justru mengirim header itu pada
# setiap permintaan biasa.
proxy_set_header Connection "";

proxy_set_header Host              $host;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host  $host;
proxy_set_header X-Real-IP         $remote_addr;

# MENIMPA, bukan menambah. Ini bukan gaya penulisan, ini batas keamanan.
#
# Idiom nginx yang lazim adalah $proxy_add_x_forwarded_for, yang MENAMBAHKAN
# IP klien ke rantai X-Forwarded-For yang sudah ada. Di sini nginx adalah
# proxy terdepan: rantai "yang sudah ada" berasal langsung dari internet, jadi
# siapa pun bisa mengirim `X-Forwarded-For: 1.2.3.4` dan nginx akan meneruskan
# `1.2.3.4, <ip-asli>`.
#
# src/lib/rate-limit.ts:56 mengambil entri PERTAMA dari rantai itu. Dengan
# idiom lazim tersebut, entri pertama sepenuhnya dikuasai penyerang: cukup
# memutar nilainya untuk melewati seluruh rate-limit RSVP, ucapan, dan amplop,
# sekaligus meracuni hash IP yang dipakai untuk deduplikasi.
#
# $remote_addr adalah alamat peer TCP yang sebenarnya. Ia tidak bisa dipalsukan
# tanpa menguasai jalur jaringannya.
proxy_set_header X-Forwarded-For $remote_addr;

proxy_connect_timeout 10s;
proxy_send_timeout    60s;
proxy_read_timeout    60s;

# Jangan menyembunyikan versi upstream, dan jangan biarkan nginx mengarang
# ulang redirect yang dikeluarkan Next.
proxy_redirect off;
