# =============================================================================
# Header keamanan Walimah — dipasang di /etc/nginx/snippets/walimah-headers.conf
# oleh deploy/install.sh. Jangan disunting di tempat; sunting di repo.
#
# Berkas ini ada karena satu jebakan nginx: `add_header` TIDAK diwariskan ke
# blok `location` yang punya `add_header` sendiri. Blok tersebut membuang
# seluruh header dari induknya, tanpa peringatan apa pun dari `nginx -t`.
# Gejalanya adalah halaman admin dan aset statis yang diam-diam kehilangan CSP
# dan HSTS, padahal konfigurasinya "terlihat benar". Karena itu setiap location
# meng-include berkas ini secara eksplisit alih-alih mengandalkan pewarisan.
#
# `always` dipakai di semua baris supaya header tetap terkirim pada respons
# galat (4xx/5xx), bukan hanya pada 2xx/3xx.
# =============================================================================

add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;

# CSP: hanya domain sendiri, plus embed peta Google.
#
# 'unsafe-inline' pada script-src TIDAK bisa dihindari di aplikasi ini, dan
# menghapusnya membuat situs mati total. Next App Router menyisipkan 15 skrip
# inline ke setiap halaman untuk membawa payload RSC dan menyalakan hidrasi;
# tanpa izin ini browser memblokir semuanya, sehingga sampul tidak bisa dibuka,
# formulir RSVP tidak mengirim, dan hitung mundur tidak berjalan.
#
# Nonce adalah jawaban yang benar untuk halaman dinamis, tapi bukan di sini:
# `/` dan `/to/[slug]` adalah SSG. Nonce wajib unik per permintaan, sedangkan
# HTML kedua rute itu dibuat sekali lalu di-cache — memakainya akan menyeret
# keduanya menjadi render dinamis dan membuang seluruh model SSG/ISR aplikasi.
#
# Yang membuat kompromi ini masih dapat dipertanggungjawabkan: seluruh masukan
# tamu dirender sebagai teks biasa oleh React, dan `dangerouslySetInnerHTML`
# tidak dipakai satu kali pun di basis kode (lihat src/lib/text.ts:53). Tanpa
# jalan untuk menyuntikkan markup, 'unsafe-inline' tidak membuka pintu yang
# sebelumnya tertutup.
#
# - 'unsafe-inline' pada style-src dibutuhkan Next untuk style inline pada
#   komponen gambar.
# - Tambahkan host gambar ke img-src bila galeri memakai URL eksternal
#   (samakan dengan remotePatterns di next.config.ts).
# - Notifikasi WhatsApp dikirim dari server (Node), bukan dari browser, jadi
#   connect-src tidak perlu memuat host gateway.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; media-src 'self'; frame-src https://www.google.com https://maps.google.com; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
