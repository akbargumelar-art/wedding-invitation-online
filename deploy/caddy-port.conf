# =============================================================================
# Drop-in systemd untuk Caddy — memasok WALIMAH_PORT ke Caddyfile.
#
#   sudo mkdir -p /etc/systemd/system/caddy.service.d
#   sudo cp deploy/caddy-port.conf /etc/systemd/system/caddy.service.d/
#   sudo systemctl daemon-reload && sudo systemctl restart caddy
#
# Cukup dipasang sekali; deploy/install.sh melakukannya untuk Anda.
#
# Ketika porta berubah, Caddy harus di-RESTART, bukan di-reload. `reload`
# menjalankan ExecReload di dalam unit yang sudah hidup, dan apakah
# EnvironmentFile ikut dibaca ulang di sana bergantung pada versi systemd —
# taruhan yang hadiahnya 502 senyap. install.sh sudah membedakan keduanya:
# restart bila porta bergeser, reload bila tidak.
#
# Berkas porta sengaja terpisah dari /etc/walimah/env. Memberi Caddy env
# lengkap milik aplikasi berarti AUTH_SECRET, CRON_SECRET, dan token WhatsApp
# ikut tersimpan di /proc/<pid>/environ milik proses yang sama sekali tidak
# membutuhkannya.
# =============================================================================

[Service]
EnvironmentFile=/etc/walimah/port
