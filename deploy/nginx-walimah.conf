# =============================================================================
# nginx server block — Walimah
#
# Dipasang deploy/install.sh ke /etc/nginx/sites-available/walimah, dengan
# __DOMAIN__ diganti host dari NEXT_PUBLIC_SITE_URL. Jangan disunting di
# tempat: setiap install.sh berikutnya menimpanya.
#
# Dipakai menggantikan deploy/Caddyfile pada VPS yang nginx-nya sudah memegang
# 80/443 untuk situs lain. Caddy tidak bisa hidup berdampingan di sana — ia
# akan gagal bind, dan menghentikan nginx demi memberi jalan berarti mematikan
# seluruh situs lain di mesin yang sama. Isi berkas ini adalah terjemahan
# satu-per-satu dari Caddyfile; keduanya harus diubah bersama.
#
# Porta backend TIDAK ditulis di sini. Ia datang dari upstream walimah_backend
# di /etc/nginx/conf.d/walimah-upstream.conf, yang ditulis deploy/resolve-port.sh
# bersamaan dengan PORT di /etc/walimah/env. Satu sumber kebenaran, tiga
# pembaca: systemd, cron, dan nginx.
# =============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__ www.__DOMAIN__;

    # Biarkan certbot memperbarui sertifikat tanpa perlu menghentikan nginx.
    # Blok ini harus berada SEBELUM redirect di bawah, sebab nginx memilih
    # location berdasarkan prefiks terpanjang, bukan urutan penulisan — tapi
    # menaruhnya di atas tetap membuat maksudnya terbaca oleh manusia.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://__DOMAIN__$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.__DOMAIN__;

    ssl_certificate     /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;

    return 301 https://__DOMAIN__$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name __DOMAIN__;

    ssl_certificate     /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;

    # Batas ukuran body 3 MB: cukup untuk bukti transfer 2 MB plus overhead
    # multipart, dan menutup upaya membanjiri disk lewat unggahan raksasa.
    # MAX_UPLOAD_BYTES di aplikasi tetap penjaga sebenarnya; ini hanya
    # memotong lebih awal, sebelum byte-nya sempat menyentuh Node.
    client_max_body_size 3m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/manifest+json;

    access_log /var/log/nginx/walimah.access.log;
    error_log  /var/log/nginx/walimah.error.log;

    # -------------------------------------------------------------------------
    # Aset statis Next bersifat immutable (nama berisi hash konten).
    # -------------------------------------------------------------------------
    location /_next/static/ {
        include /etc/nginx/snippets/walimah-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;

        proxy_pass http://walimah_backend;
        include /etc/nginx/snippets/walimah-proxy.conf;
    }

    # -------------------------------------------------------------------------
    # Halaman dan API admin tidak boleh disimpan cache mana pun.
    # -------------------------------------------------------------------------
    location /admin {
        include /etc/nginx/snippets/walimah-headers.conf;
        add_header Cache-Control "private, no-store" always;

        proxy_pass http://walimah_backend;
        include /etc/nginx/snippets/walimah-proxy.conf;
    }

    location /api/admin/ {
        include /etc/nginx/snippets/walimah-headers.conf;
        add_header Cache-Control "private, no-store" always;

        proxy_pass http://walimah_backend;
        include /etc/nginx/snippets/walimah-proxy.conf;
    }

    # -------------------------------------------------------------------------
    # Endpoint cron hanya boleh dipanggil dari mesin itu sendiri. CRON_SECRET
    # memang sudah melindunginya, tapi rahasia yang tidak pernah melintasi
    # jaringan jauh lebih sulit bocor daripada rahasia yang hanya diperiksa.
    #
    # allow/deny di sini menilai $remote_addr, yakni IP yang benar-benar
    # membuka koneksi TCP — bukan header yang bisa ditulis siapa saja.
    # -------------------------------------------------------------------------
    location /api/cron/ {
        allow 127.0.0.1;
        allow ::1;
        deny all;

        include /etc/nginx/snippets/walimah-headers.conf;
        proxy_pass http://walimah_backend;
        include /etc/nginx/snippets/walimah-proxy.conf;
    }

    location / {
        include /etc/nginx/snippets/walimah-headers.conf;

        proxy_pass http://walimah_backend;
        include /etc/nginx/snippets/walimah-proxy.conf;
    }
}
